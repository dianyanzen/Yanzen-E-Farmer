name: yz-farm-life

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - yz_farm_life_pgdata:/var/lib/postgresql/data
      - ./database/yz-farm-life.sql:/docker-entrypoint-initdb.d/001-yz-farm-life.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - game-data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      GAME_RESIDENT_ROSTER: /run/yz-game-private/residents.json
      GAME_HTTP_LOGIN_ORIGIN: ${GAME_HTTP_LOGIN_ORIGIN:-}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./deploy/private:/run/yz-game-private:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: unless-stopped
    networks:
      - game-data

  proxy:
    image: nginx:1.28-alpine
    volumes:
      - ./deploy/nginx.game.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${GAME_PORT:-3002}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    restart: unless-stopped
    networks:
      - game-data
      - game-ingress

networks:
  game-data:
    name: yz_farm_life_data
    internal: true
  game-ingress:
    name: yz_farm_life_ingress

volumes:
  yz_farm_life_pgdata:
    name: yz_farm_life_pgdata
