<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">YZ — Yanzen E-Farmer</title>
<desc id="desc">Monogram YZ, tunas hijau dan kontur kebun pada latar hijau tua.</desc>
<defs>
<linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b4b39"/><stop offset="1" stop-color="#052c23"/></linearGradient>
<linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf0"/><stop offset="1" stop-color="#e4e7c6"/></linearGradient>
<linearGradient id="leaf" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#c3db94"/><stop offset="1" stop-color="#4f936c"/></linearGradient>
<linearGradient id="field" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#c9db9f"/><stop offset="1" stop-color="#51956d"/></linearGradient>
<clipPath id="badge"><rect width="128" height="128" rx="27"/></clipPath>
</defs>
<g clip-path="url(#badge)">
<rect width="128" height="128" rx="27" fill="url(#background)"/>
<!-- Sprout emerging from the Y -->
<path d="M56 50C35 47 25 39 20 20c23 0 36 8 40 31C55 39 44 31 35 27c16 5 23 15 26 29" fill="url(#leaf)"/>
<path d="M62 52c2-22 15-34 32-33-2 17-12 29-32 33 5-11 12-20 22-26-13 5-21 14-22 26" fill="#f2f3d7"/>
<!-- Interlocking Y and Z letters -->
<path d="M26 47h15l21 24 20-24h24c3 0 5 2 5 5s-2 6-5 6H87L68 80v20H54V80Z" fill="url(#light)"/>
<path d="M88 59h19L78 85h22c10 0 15 6 15 15H65V89Z" fill="url(#light)"/>
<!-- rolling farm contours -->
<path d="M5 97c31-17 79-19 123-3v34H0Z" fill="#083b2d"/>
<path d="M-8 101c29-17 69-19 105-9 16 5 26 11 40 22" fill="none" stroke="#bcd99b" stroke-width="6"/>
<path d="M-9 111c42-20 83-15 118 15" fill="none" stroke="#75b285" stroke-width="9"/>
<path d="M17 127c23-19 50-17 73 4" fill="none" stroke="#387d60" stroke-width="20"/>
</g></svg>