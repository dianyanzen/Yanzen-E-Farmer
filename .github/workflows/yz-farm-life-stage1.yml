name: YZ Farm Life Stage 1 — Quality
on:
  push:
    branches:
      - feat/yz-farm-life-stage1
  pull_request:
    paths:
      - "src/app/game/**"
      - "src/lib/game/**"
      - "tests/game-stage1.mjs"
      - "supabase/migrations/*yz_game*"
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test game model
        run: node tests/game-stage1.mjs
      - name: Lint
        run: npm run lint
