name: YZ Farm Life Stage 1 — Quality
on:
  push:
    branches:
      - feat/yz-farm-life-stage1
      - feat/yz-pasirluyu-chapter1
      - feat/yanzen-spatial-irrigation-20261125
  pull_request:
    paths:
      - ".agents/**"
      - "AGENTS.md"
      - "docs/game-dev/HUMANIZER_DIALOGUE_PIPELINE.md"
      - "tests/game-humanizer-skill.mjs"
      - "package.json"
      - "src/app/game/**"
      - "src/lib/game/**"
      - "tests/game-stage1.mjs"
      - "tests/game-save.mjs"
      - "tests/game-*-ui.mjs"
      - "tests/game-ui-api-fixture.mjs"
      - "src/app/api/game/**"
      - "src/app/api/auth/**"
      - ".github/workflows/yz-farm-life-stage1.yml"
      - "public/game/assets/story/**"
      - "game-assets/**"
      - "scripts/game-assets/**"
      - "tests/game-asset-database.mjs"
      - "public/game/assets/**"
      - "supabase/migrations/*yz_game*"
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check asset database freshness and references
        run: npm run assets:index:check && npm run assets:categories:check && npm run test:game:assets
      - name: Validate PNG headers and portrait geometry
        run: npm run assets:quality
      - name: Test game model
        run: npm run test:game
      - name: Test core browser flows
        run: npm run test:game:ui && npm run test:game:life:ui && npm run test:portraits:ui && npm run test:game:starter:ui
      - name: Lint
        run: npm run lint
