name: YZ E-Farmer — website release quality

on:
  push:
    branches:
      - release/yz-e-farmer-web
  pull_request:
    branches:
      - release/yz-e-farmer-web
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yz-web-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Protect E-Farmer web routes
        run: |
          test -f src/app/layout.tsx
          test -f src/app/page.tsx
          test -f src/app/anggaran/page.tsx
          test -f src/app/login/page.tsx
          if grep -Eq 'pageExtensions.*game\.tsx' next.config.ts 2>/dev/null; then
            echo "::error::Game-only Next pageExtensions would hide E-Farmer website routes."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Baseline game model tests
        run: npm run test:game
