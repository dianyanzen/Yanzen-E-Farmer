name: Render Pasirluyu Cinematic HD
on:
  push:
    branches:
      - fix/widi-portrait-quest-memory-hd-cinematic-20261122
    paths:
      - 'cutscenes/remotion/**'
      - '.github/workflows/render-sluice-remotion.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-hd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chrome libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libgbm1 libasound2t64 || true
      - name: Prepare scene assets
        run: |
          mkdir -p cutscenes/remotion/public
          cp public/game/assets/characters/stage1.png cutscenes/remotion/public/yanzen-actor.png
          cp game-assets/yz-farm-life/aset/audio/kanal.wav cutscenes/remotion/public/kanal.wav
      - name: Install Remotion and render master
        working-directory: cutscenes/remotion
        run: |
          npm install --no-audit --no-fund
          npx remotion browser ensure
          npm run render
      - name: Publish HD film
        run: |
          set -euo pipefail
          test -s cutscenes/remotion/out/sluice-gate.mp4
          ffmpeg -y -hide_banner -loglevel error -i cutscenes/remotion/out/sluice-gate.mp4 \
            -c:v libx264 -preset slow -crf 21 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            public/game/assets/cutscenes/sluice-gate.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration \
            -of default=noprint_wrappers=1 public/game/assets/cutscenes/sluice-gate.mp4
      - name: Sync asset catalog and open QA gate
        run: |
          set -euo pipefail
          git add public/game/assets/cutscenes/sluice-gate.mp4
          node scripts/game-assets/build-asset-database.mjs
          node scripts/game-assets/build-asset-categories.mjs
          npm run assets:index:check
          npm run assets:categories:check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-assets/catalog/asset-database.json game-assets/library/
          if ! git diff --cached --quiet; then
            git commit -m 'assets(game): deliver HD Remotion sluice cinematic and sync media manifest'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
