name: Import owner-approved Pasirluyu cinematic
on:
  push:
    branches:
      - feat/sluice-user-video-cinematic-standard-20261122
    paths:
      - .github/workflows/import-pasirluyu-user-video.yml
permissions:
  contents: write
concurrency:
  group: owner-sluice-import
  cancel-in-progress: false
jobs:
  import-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download original approved video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/game/assets/cutscenes/frames
          curl --fail --location --retry 3 --max-time 120 \
            --output public/game/assets/cutscenes/sluice-gate.mp4 \
            'https://at.adobe.com/jNUhZwyu6AbBFBQF'
          printf '%s  %s\n' \
            '6692a1a19cf1f466121bc0ba2dcec5e431bab1e9043f4103ca9e7804be105b20' \
            'public/game/assets/cutscenes/sluice-gate.mp4' | sha256sum --check --status
      - name: Check duration, codec, native size and sound
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          python3 - <<'PY'
          import json, subprocess, os
          path="public/game/assets/cutscenes/sluice-gate.mp4"
          result=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","stream=codec_type,codec_name,width,height,r_frame_rate","-show_entries","format=duration","-of","json",path]))
          video=next(x for x in result["streams"] if x["codec_type"]=="video")
          audio=next(x for x in result["streams"] if x["codec_type"]=="audio")
          assert (video["width"],video["height"],video["r_frame_rate"])==(910,512,"30/1"),video
          assert video["codec_name"]=="h264" and audio["codec_name"]=="aac"
          assert abs(float(result["format"]["duration"])-10.0)<0.05
          assert os.stat(path).st_size==6199340
          print("PASS: source H.264 + AAC, 910x512, 30fps, 10 seconds, 6.2 MB")
          PY
      - name: Derive two continuity frames and exact cinematic poster
        shell: bash
        run: |
          set -euo pipefail
          src=public/game/assets/cutscenes/sluice-gate.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 0.2 -i "$src" -frames:v 1 -q:v 2 public/game/assets/cutscenes/frames/sluice-start.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 9.6 -i "$src" -frames:v 1 -q:v 2 public/game/assets/cutscenes/frames/sluice-end.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 7.7 -i "$src" -frames:v 1 public/game/assets/cutscenes/sluice-poster.png
      - name: Index replacement asset and all associated frames
        shell: bash
        run: |
          set -euo pipefail
          git add public/game/assets/cutscenes/sluice-gate.mp4 public/game/assets/cutscenes/sluice-poster.png \
            public/game/assets/cutscenes/frames/sluice-start.jpg public/game/assets/cutscenes/frames/sluice-end.jpg
          node scripts/game-assets/build-asset-database.mjs
          node scripts/game-assets/build-asset-categories.mjs
          node tests/game-cutscene-production.mjs
          node scripts/game-assets/build-asset-database.mjs --check
          node scripts/game-assets/build-asset-categories.mjs --check
      - name: Commit original video, poster, keyframes and refreshed catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-assets/catalog/asset-database.json game-assets/library/
          if ! git diff --cached --quiet; then
            git commit -m 'assets(game): replace Remotion with owner-supplied Pasirluyu video and dual reference frames'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
